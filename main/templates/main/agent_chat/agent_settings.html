<div class="settings-section">
    <button class="settings-btn" id="settingsToggleBtn">
        <svg fill="none" height="16" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span data-i18n="settings">Settings</span>
    </button>
    <div class="settings-panel" id="settingsPanel" style="display: none;">
        <div class="setting-group">
            <label data-i18n="agent_type">Agent Type</label>
            <div class="agent-buttons">
                <button class="agent-option" data-agent="assistant">🤖 Assistant</button>
                <button class="agent-option" data-agent="analyst">📊 Analyst</button>
                <button class="agent-option" data-agent="researcher">🔬 Researcher</button>
            </div>
        </div>
        <div class="setting-group">
            <label data-i18n="citation_style">Citation Style</label>
            <div class="citation-buttons">
                <button class="citation-option" data-style="gost-r">ГОСТ Р</button>
                <button class="citation-option" data-style="apa">APA</button>
                <button class="citation-option" data-style="mla">MLA</button>
            </div>
        </div>
        <div class="setting-group">
            <label>Temperature: <span id="tempVal">0.7</span></label>
            <input id="tempSlider" max="1" min="0" step="0.05" type="range" value="0.7">
        </div>
        <div class="setting-group">
            <label><input checked id="streamToggle" type="checkbox"> <span
                    data-i18n="streaming">Streaming responses</span></label>
        </div>
        <div class="setting-group">
            <label><input checked id="citationsToggle" type="checkbox"> <span
                    data-i18n="show_citations">Show citations</span></label>
        </div>
        <div class="setting-group">
            <label><input checked id="soundToggle" type="checkbox"> <span data-i18n="sound_effects">Sound effects</span></label>
        </div>
        <div class="setting-group">
            <label><input checked id="autoScrollToggle" type="checkbox"> <span
                    data-i18n="auto_scroll">Auto-scroll</span></label>
        </div>
    </div>
</div>
