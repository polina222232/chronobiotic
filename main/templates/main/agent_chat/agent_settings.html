<div class="settings-container">
    <button class="settings-btn" id="settingsBtn">⚙️ Settings</button>
    <div class="settings-panel" id="settingsPanel" style="display: none;">
        <div class="setting-group">
            <label>Agent Type</label>
            <div class="agent-buttons">
                <button class="agent-option" data-agent="assistant" type="button">🤖 Assistant</button>
                <button class="agent-option" data-agent="analyst" type="button">📊 Analyst</button>
                <button class="agent-option" data-agent="researcher" type="button">🔬 Researcher</button>
            </div>
        </div>
        <div class="setting-group">
            <label>Citation Style</label>
            <div class="citation-buttons">
                <button class="citation-option" data-style="gost-r" type="button">ГОСТ Р</button>
                <button class="citation-option" data-style="apa" type="button">APA</button>
                <button class="citation-option" data-style="mla" type="button">MLA</button>
            </div>
        </div>
        <div class="setting-group">
            <label>Temperature: <span id="tempVal">0.7</span></label>
            <input id="tempSlider" max="1" min="0" step="0.05" type="range" value="0.7">
        </div>
        <div class="setting-group">
            <label><input checked id="streamToggle" type="checkbox"> Streaming responses</label>
        </div>
        <div class="setting-group">
            <label><input checked id="citationsToggle" type="checkbox"> Show citations</label>
        </div>
        <div class="setting-group">
            <label><input checked id="soundToggle" type="checkbox"> Sound effects</label>
        </div>
        <div class="setting-group">
            <label><input checked id="autoScrollToggle" type="checkbox"> Auto-scroll</label>
        </div>
    </div>
</div>
