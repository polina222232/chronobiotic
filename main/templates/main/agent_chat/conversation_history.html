<div class="history-section">
    <div class="history-header">
        <span data-i18n="recent">Recent chats</span>
        <button class="sidebar-action" id="searchHistoryBtn" title="Search">
            <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" x2="16.65" y1="21" y2="16.65"/>
            </svg>
        </button>
    </div>
    <input class="history-search" id="historySearch" placeholder="Search conversations..." style="display: none;"
           type="text">
    <ul class="history-list" id="historyList">
        <li class="history-item empty" data-i18n="no_chats">No chats yet</li>
    </ul>
</div>
