<script id="messageTemplate" type="text/template">
    <div class="message {{role}}" data-message-id="{{id}}">
        <div class="message-avatar">{{avatar}}</div>
        <div class="message-content">
            <div class="message-text">{{{content}}}</div>
            <div class="message-time">{{time}}</div>
            <div class="message-actions">
                <button class="copy-msg" title="Copy">📋 Copy</button>
                {{#if_eq role "user"}}
                <button class="edit-msg" title="Edit">✏️ Edit</button>
                {{/if_eq}}
                {{#if_eq role "assistant"}}
                <button class="speak-msg" title="Listen">🔊 Listen</button>
                <button class="regenerate-msg" title="Regenerate">🔄 Regenerate</button>
                {{/if_eq}}
            </div>
        </div>
    </div>
</script>
