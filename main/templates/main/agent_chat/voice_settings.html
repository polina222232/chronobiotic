<
<div class="voice-settings-panel">
    <button class="voice-settings-toggle" id="voiceSettingsToggle">
        <i class="fas fa-microphone-alt"></i> Voice Settings
    </button>
    <div class="voice-settings-content" id="voiceSettingsContent" style="display: none;">
        <div class="settings-section">
            <div class="section-title">
                <i class="fas fa-microphone"></i> Input
            </div>
            <div class="setting-item">
                <div class="setting-label">
                    <span>Language</span>
                </div>
                <select class="voice-select" id="voiceLanguage">
                    <option value="en-US">English (US)</option>
                    <option value="en-GB">English (UK)</option>
                    <option value="ru-RU">Русский</option>
                    <option value="es-ES">Español</option>
                </select>
            </div>
        </div>

        <div class="settings-section">
            <div class="section-title">
                <i class="fas fa-volume-up"></i> Output
            </div>
            <div class="setting-checkbox">
                <label>
                    <input checked id="autoPlayVoice" type="checkbox">
                    <span>Auto-play responses</span>
                </label>
            </div>
            <div class="setting-item">
                <div class="setting-label">
                    <span>Speed</span>
                    <span id="voiceSpeedValue">1.0</span>
                </div>
                <input id="voiceSpeed" max="2" min="0.5" step="0.1" type="range" value="1">
            </div>
        </div>

        <button class="test-voice-btn" id="testVoiceBtn">
            <i class="fas fa-play"></i> Test Voice
        </button>
    </div>
</div>

<style>
    .voice-settings-panel {
        width: 100%;
        margin-top: 8px;
    }

    .voice-settings-toggle {
        width: 100%;
        padding: 10px 12px;
        background: #2d2e32;
        border: none;
        border-radius: 8px;
        color: #e5e5e5;
        cursor: pointer;
        text-align: left;
        font-size: 0.85rem;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .voice-settings-toggle:hover {
        background: #3a3b40;
    }

    .voice-settings-content {
        margin-top: 8px;
        background: #2d2e32;
        border-radius: 8px;
        padding: 12px;
    }

    .voice-select {
        width: 100%;
        padding: 8px 10px;
        background: #1e1f23;
        border: 1px solid #3a3b40;
        border-radius: 6px;
        color: #e5e5e5;
        font-size: 0.8rem;
        cursor: pointer;
    }

    .voice-select:focus {
        outline: none;
        border-color: #667eea;
    }

    .test-voice-btn {
        width: 100%;
        padding: 8px;
        background: #1e1f23;
        border: 1px solid #3a3b40;
        border-radius: 6px;
        color: #667eea;
        cursor: pointer;
        font-size: 0.75rem;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .test-voice-btn:hover {
        background: #3a3b40;
        border-color: #667eea;
    }
</style>
