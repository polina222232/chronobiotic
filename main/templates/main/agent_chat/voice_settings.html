<div class="voice-settings">
    <button class="voice-settings-btn" id="voiceSettingsBtn">🎤 Voice Settings</button>
    <div class="voice-panel" id="voicePanel" style="display: none;">
        <div class="setting-group">
            <label>Voice Language</label>
            <select id="voiceLangSelect">
                <option value="en-US">English (US)</option>
                <option value="en-GB">English (UK)</option>
                <option value="ru-RU">Русский</option>
                <option value="es-ES">Español</option>
                <option value="fr-FR">Français</option>
                <option value="zh-CN">中文</option>
                <option value="it-IT">Italiano</option>
                <option value="ko-KR">한국어</option>
                <option value="de-DE">Deutsch</option>
                <option value="hi-IN">हिन्दी</option>
            </select>
        </div>
        <div class="setting-group">
            <label>Voice Gender</label>
            <div class="gender-buttons">
                <button class="gender-option" data-gender="female" type="button">👩 Female</button>
                <button class="gender-option" data-gender="male" type="button">👨 Male</button>
            </div>
        </div>
        <div class="setting-group">
            <label>Speed: <span id="voiceSpeedVal">1.0</span></label>
            <input id="voiceSpeedSlider" max="2" min="0.5" step="0.1" type="range" value="1">
        </div>
        <div class="setting-group">
            <label>Pitch: <span id="voicePitchVal">1.0</span></label>
            <input id="voicePitchSlider" max="2" min="0.5" step="0.1" type="range" value="1">
        </div>
        <div class="setting-group">
            <label><input checked id="autoPlayVoiceCheck" type="checkbox"> Auto-play responses</label>
        </div>
        <button class="test-voice-btn" id="testVoiceBtn" type="button">🔊 Test Voice</button>
    </div>
</div>
