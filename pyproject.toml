[tool.poetry]
name = "chronobiotic"
version = "0.1.0"
description = "Chronobiotic Agent - AI-powered research assistant for chronobiology and chemistry"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/yourusername/chronobiotic"
documentation = "https://github.com/yourusername/chronobiotic#readme"
keywords = ["django", "ai", "chronobiology", "chemistry", "llm", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Medical Science Applications.",
]

[tool.poetry.dependencies]
python = "^3.11"

# Core Django
Django = "^5.1.2"
channels = "^4.3.2"
channels-redis = "^4.2.0"
daphne = "^4.1.2"
asgiref = "^3.9.0"

# Database
psycopg2-binary = "^2.9.10"
sqlparse = "^0.5.3"
redis = "^5.2.1"

# Image processing
pillow = "^11.1.0"

# Timezone
tzdata = "^2025.1"

# REST API
djangorestframework = "^3.15.2"
drf-yasg = "^1.21.10"
django-cors-headers = "^4.7.0"

# Environment & Config
python-decouple = "^3.8"
python-dotenv = "^1.0.1"

# LLM & AI
openai = "^1.59.3"
anthropic = "^0.42.0"

# Celery
celery = {extras = ["redis"], version = "^5.4.0"}

# HTTP client
httpx = "^0.27.0"
requests = "^2.32.0"

# Data processing
pandas = "^2.2.0"
numpy = "^1.26.0"

# Chemistry
rdkit = "^2024.3.0"

# OCR and vision
easyocr = "^1.7.0"
pytesseract = "^0.3.10"

# PDF processing
pdfplumber = "^0.11.0"
PyPDF2 = "^3.0.0"

# Logging and monitoring
sentry-sdk = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-django = "^4.8.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.0.0"
flake8 = "^7.0.0"
isort = "^5.13.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_django = "django"
known_first_party = "chronobiotic,main,utils"
sections = "FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "chronobiotic.settings_test"
python_files = ["tests.py", "test_*.py", "*_test.py"]
addopts = "-v --cov=. --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
